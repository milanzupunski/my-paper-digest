name: Weekly digest

on:
  schedule:
    # GitHub often starts scheduled runs late or skips them, so the digest is
    # tried every hour on Monday, and every 4 hours on Tuesday as a fallback.
    # As soon as one run gets through, the rest see that this week's digest
    # exists and stop after a few seconds. Times are UTC.
    # minute hour day-of-month month day-of-week
    - cron: "17 * * * 1"
    - cron: "17 */4 * * 2"
  workflow_dispatch:
    inputs:
      days:
        description: "How many days to look back (leave empty for the default in profiles.txt; use 30 for a first run)"
        required: false
        default: ""

permissions:
  contents: write   # save the digest and the list of papers already shown
  pages: write      # publish the web page
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  digest:
    # The original template repository does not run itself, so copies made
    # from it start clean (no one else's digests or reading history).
    if: github.repository != 'milanzupunski/plant-paper-digest'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if this week's digest already exists
        id: check
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f docs/runs.json ]; then
            last=$(python3 -c "import json; print(json.load(open('docs/runs.json'))[0]['date'])" 2>/dev/null || echo 2000-01-01)
            age=$(( ( $(date -u +%s) - $(date -u -d "$last" +%s) ) / 86400 ))
            if [ "$age" -lt 6 ]; then
              echo "This week's digest ($last) already exists; nothing to do."
              echo "skip=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install requests
        if: steps.check.outputs.skip != 'true'
        run: pip install requests

      - name: Build the digest
        if: steps.check.outputs.skip != 'true'
        env:
          DAYS: ${{ github.event.inputs.days }}
        run: |
          if [[ "$DAYS" =~ ^[0-9]+$ ]]; then
            python digest.py --site docs --days "$DAYS"
          else
            python digest.py --site docs
          fi

      - name: Save the digest and the list of papers already shown
        if: always() && steps.check.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs seen.json state.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new to save."
          else
            git commit -m "Digest $(date -u +%Y-%m-%d)"
            # if something else was saved meanwhile, put this run's files on top
            for i in 1 2 3; do
              git pull --rebase -X theirs origin main && git push && break
              sleep 10
            done
          fi

      - uses: actions/configure-pages@v5
        if: steps.check.outputs.skip != 'true'
      - uses: actions/upload-pages-artifact@v3
        if: steps.check.outputs.skip != 'true'
        with:
          path: docs
      - id: deploy
        if: steps.check.outputs.skip != 'true'
        uses: actions/deploy-pages@v4
